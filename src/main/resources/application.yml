server:
  port: 8082

spring:
  application:
    name: ms-clases
  datasource:
    url: jdbc:mysql://localhost:3306/db_gym_clases?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# URLs de los otros microservicios (Feign)
ms:
  entrenadores:
    url: http://localhost:8081
  miembros:
    url: http://localhost:8083
  suscripciones:
    url: http://localhost:8084
  gamificacion:
    url: http://localhost:8089
  notificaciones:
    url: http://localhost:8091

jwt:
  secret: TXV5TGdyYVNlZ3VyYVBhcmFHeW1TeW5jMjAyNkNvbnRyYXNlbmE=

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Configuracion Swagger OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html